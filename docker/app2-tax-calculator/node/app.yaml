# ============================================================
# SERVICE A - DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: service-a

spec:
  replicas: 3

  selector:
    matchLabels:
      app: service-a

  template:
    metadata:
      labels:
        app: service-a

    spec:
      containers:
        - name: service-a
          image: maruthi127/node-tax-calculator-service-a:latest

          ports:
            - containerPort: 3000

          env:
            - name: TAX_SERVICE_URL
              value: "http://service-b:4000"

            - name: FRONTEND_URL
              value: "http://localhost:8080"


---
# ============================================================
# SERVICE A - SERVICE
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: service-a

spec:
  type: NodePort

  selector:
    app: service-a

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30083


---
# ============================================================
# SERVICE B - DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: service-b

spec:
  replicas: 3

  selector:
    matchLabels:
      app: service-b

  template:
    metadata:
      labels:
        app: service-b

    spec:
      containers:
        - name: service-b
          image: maruthi127/node-tax-calculator-service-b:latest

          ports:
            - containerPort: 4000


---
# ============================================================
# SERVICE B - SERVICE
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: service-b

spec:
  type: ClusterIP

  selector:
    app: service-b

  ports:
    - port: 4000
      targetPort: 4000