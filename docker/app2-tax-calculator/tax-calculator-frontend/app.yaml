apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tax-frontend

  template:
    metadata:
      labels:
        app: tax-frontend

    spec:
      containers:
        - name: tax-frontend
          image: tax-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: tax-frontend-service

spec:
  type: NodePort

  selector:
    app: tax-frontend

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085