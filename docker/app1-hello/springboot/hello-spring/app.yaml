apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-spring

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-spring

  template:
    metadata:
      labels:
        app: hello-spring

    spec:
      containers:
        - name: hello-spring
          image: maruthi127/hello-spring:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: hello-spring-service

spec:
  type: NodePort

  selector:
    app: hello-spring

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082