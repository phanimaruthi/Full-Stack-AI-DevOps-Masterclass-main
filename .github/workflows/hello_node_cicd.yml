name: Hello Node App to Docker

on:
  workflow_dispatch:

  push:
    paths:
      - "docker/app1-hello/node/**"
      - ".github/workflows/hello_node_cicd.yml"

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: docker/app1-hello/node
        run: npm install

      - name: Check JavaScript syntax
        working-directory: docker/app1-hello/node
        run: node --check app.js

      - name: Run tests
        working-directory: docker/app1-hello/node
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/node
          file: docker/app1-hello/node/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.ref_name }}