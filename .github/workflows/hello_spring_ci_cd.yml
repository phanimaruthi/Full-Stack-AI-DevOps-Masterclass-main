name: Hello Spring Boot App to Docker and EKS

on:
  workflow_dispatch:

  push:
    paths:
      - "docker/app1-hello/springboot/hello-spring/**"
      - ".github/workflows/hello-spring.yml"

jobs:

  # ============================================================
  # CI: BUILD + TEST
  # ============================================================
  build-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test with Maven
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports


  # ============================================================
  # BUILD + PUSH DOCKER IMAGE
  # ============================================================
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR for Docker
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/springboot/hello-spring
          file: docker/app1-hello/springboot/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.ref_name }}


