name: Hello Python App to Docker

on:
  workflow_dispatch:

  push:
    paths:
      - "docker/app1-hello/python/**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: docker/app1-hello/python
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: docker/app1-hello/python
        run: pytest --maxfail=1 --disable-warnings -q

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/python
          file: docker/app1-hello/python/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:${{ github.ref_name }}